<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run of Show</title>
<style>
  :root {
    --bg: #0a0c0f; --panel: #12151a; --panel-2: #171b21; --line: #242a32;
    --text: #eef1f5; --muted: #8a93a1; --dim: #59616d;
    --accent: #e5484d; --ok: #3ecf8e; --warn: #f5a524; --cloud: #ff7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button { font: inherit; color: inherit; cursor: pointer; }
  kbd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }

  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 14px 12px; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; }
  .bar h1::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--accent); }
  .small-btn { font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; color: var(--muted); }
  .small-btn:hover { color: var(--text); border-color: var(--dim); }

  .next { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .next .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .next .ws { color: var(--warn); text-transform: none; letter-spacing: 0; }
  .next .txt { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .copy-big { background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; color: #fff; white-space: nowrap; }
  .copy-big:disabled { background: var(--line); color: var(--dim); cursor: default; }

  main { padding: 6px 14px 40px; }
  section { border-bottom: 1px solid var(--line); padding: 14px 0; }
  section > h2 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
  section > h2 .t { font-size: 12px; font-weight: 400; color: var(--dim); }
  section > h2 .ws { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--warn); border: 1px solid #4a3a16; border-radius: 6px; padding: 1px 7px; }
  .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 3px; }
  ul, ol { margin: 0; padding-left: 20px; } li { margin: 2px 0; }
  .say li { color: #c9d1dc; }
  .hot { color: var(--warn); font-weight: 600; }

  .card { position: relative; width: 100%; text-align: left; margin: 8px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 12px; transition: border-color .15s, background .15s; }
  .card:hover { border-color: var(--dim); }
  .card.is-next { border-color: var(--accent); }
  .card.done { opacity: .55; }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .card .id { font-weight: 700; font-size: 13px; }
  .card .route { font-size: 11px; border-radius: 5px; padding: 1px 6px; border: 1px solid var(--line); color: var(--muted); }
  .card .route.cloud { color: var(--cloud); border-color: #5a2f1e; }
  .card .state { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .card.done .state { color: var(--ok); }
  .card .q { font-size: 15px; color: var(--text); }
  .card .meta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .card .meta b { color: var(--ok); font-weight: 600; }
  .card .meta .after { color: #c9d1dc; }
  .card.flash { background: #1d2a22; }

  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h2 { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 16px; }
  details > summary h2::before { content: "\25B8"; color: var(--dim); font-size: 13px; }
  details[open] > summary h2::before { content: "\25BE"; }
  .warnbox { margin-top: 8px; font-size: 13px; color: #e8c58a; background: #1f1a10; border: 1px solid #3d3016; border-radius: 10px; padding: 8px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  td, th { text-align: left; vertical-align: top; padding: 5px 6px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .check li { list-style: none; margin-left: -20px; }
  .check input { margin-right: 6px; accent-color: var(--ok); }
  .foot { color: var(--dim); font-size: 12px; padding: 12px 14px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--ok); color: var(--text); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <h1>Run of Show</h1>
    <span class="pill" title="AnythingLLM status, read from the meter helper"><span class="dot" id="allmDot"></span><span id="allmTxt">AnythingLLM</span></span>
    <button class="small-btn" id="resetBtn" title="Clear the copied marks">Reset</button>
  </div>
  <div class="next">
    <div>
      <div class="lbl">Next prompt <span class="ws" id="nextWs"></span></div>
      <div class="txt" id="nextTxt"></div>
    </div>
    <button class="copy-big" id="nextBtn">Copy <kbd style="background:transparent;border-color:rgba(255,255,255,.4);color:#fff">Space</kbd></button>
  </div>
</div>
<main id="main"></main>
<div class="foot">Click a prompt or press its number to copy it, then paste into AnythingLLM with Ctrl+V. Space copies the next prompt. Never click Stop on a reply.</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  // The run of show. Keep in sync with docs/STAGE_SCRIPT.md.
  const SHOW = [
    { title: "Before you walk on", check: [
      "Ran Demo Pre-show Reset (preshow.cmd)",
      "Charger unplugged, airplane mode on",
      "Spotify, Ollama and other heavy apps closed",
      "AnythingLLM open on Quick Answers",
      "Meter on the second screen, status green, reset with R"
    ] },
    { title: "Opening", time: "20 s", say: [
      "This laptop is unplugged and in airplane mode. No internet, no cloud.",
      "Everything you'll see runs on the Snapdragon chip right here, with AnythingLLM.",
      "Our scenario: a sales team answering a water district's RFP. Six real-looking files: the RFP, the security policy, our product spec, pricing, customer interviews and a meeting transcript.",
      "Three things to watch: it's private, it works offline, and it costs nothing per question."
    ] },
    { title: "Beat 1: Embed the RFP live", time: "30 s", ws: "Deal Room", doList: [
      "Open Deal Room, click the upload icon next to the workspace name.",
      "Tick MBWD_RFP_2026-14_Field_Inspection_Platform.pdf.",
      "Click Move to Workspace, then Save and Embed."
    ], say: [
      "The RFP just landed. I'm adding it to our deal workspace.",
      "It's being read and indexed on this PC. The document never leaves the device.",
      "(Point at the meter) On a cloud API, that embedding costs money. Here it's zero."
    ] },
    { title: "Beat 2: Three fast questions", time: "60 s", ws: "Quick Answers",
      sayFirst: "This is the fast lane. It runs on the NPU, the chip's AI engine.",
      prompts: [
        { id: "Q1", text: "According to the RFP, when exactly are written questions due and who should they be sent to?", expect: "October 9, 5:00 PM Pacific; Janet Okafor", after: "Instant, and it read the RFP we added seconds ago." },
        { id: "Q2", text: "How many customers complained about battery life, and how much battery do we use per hour with location on?", expect: "4 of 6; 8% to 12%", after: "That's two different files, interviews and spec, in one answer." },
        { id: "Q3", text: "What is our total proposal price and how much room is left under the budget?", expect: "$995,520; $154,480", after: "Pricing data that would never go to a public cloud." }
      ] },
    { title: "Beat 3: Pre-warm and cost meter", time: "30 s", hot: "The moment the Q3 answer appears, press Ctrl+Alt+W. Then turn to the meter.", say: [
      "Look at the second screen. That's what these questions would cost on a cloud AI API.",
      "On this PC: $0.00. No per-token fees, no subscription meter running.",
      "Now scale it up. (Point at At team scale) For a 1,000-person team, that's about $100,000 a year on the cheapest cloud tier."
    ], wait: "Wait until the taskbar reads deal-room: READY (about 30 s on battery)." },
    { title: "Beat 4: The deep question", time: "60 s", ws: "Deal Room", prompts: [
        { id: "Deep", text: "List every conflict between Corvane Inspect and the District's security policy ISP-07 as a table: policy section, what the policy requires, what our product does. No other text.", expect: "Conflicts at ISP-07 4.3, 5.2, 5.4, 6.1, 7.3, 9.2 (usually 5 of 6)", after: "It found the conflicts, including ones the team missed." }
      ], say: [
      "This is the deep lane: a bigger 16K-context model comparing our spec against their security policy.",
      "(Open the Start menu or drag a window) The PC is still responsive. The AI uses about 3 of 18 cores.",
      "This is the work a sales engineer spends an afternoon on."
    ], note: "First words in about 5 s, full answer in 35 to 50 s. Point to 7.3 (Dublin support access) and 9.2 (30-day cache purge) if they appear; the team missed both. Don't promise an exact count." },
    { title: "Close", time: "20 s", say: [
      "Every question today: private, offline, and $0.00.",
      "The cloud meter kept running. This laptop didn't charge a cent.",
      "That's on-device AI on Snapdragon. Thank you."
    ] },
    { title: "Encore: Model Router", time: "2 min, optional", ws: "Bid Desk", encore: true,
      doList: ["Say \"One more thing\", then turn airplane mode off. Wait for Wi-Fi.", "Open Bid Desk. Ask R1, R2, R3 in this order only."],
      sayFirst: "Some work is worth sending to a bigger model. Most isn't. This workspace has a router: private stays here, routine stays free, and only polished client writing goes to the cloud.",
      prompts: [
        { id: "R1", route: "Local", text: "According to the RFP, when exactly are written questions due and who should they be sent to?", after: "A routine lookup. It stayed on this PC and cost nothing." },
        { id: "R2", route: "Cloud", text: "Write a one-page cover letter from Corvane to Janet Okafor for our response to RFP 2026-14. Polish it for a public agency.", after: "(Point at the meter) That one went to GPT-6.1 Sol in the cloud, the same model the meter has been pricing all along. That's what it actually cost." },
        { id: "R3", route: "Local", text: "Write a confidential cover letter note to our team on our pricing strategy.", after: "It says cover letter, but it also says confidential. The lock rule wins, so it never left the PC." },
        { id: "R4", route: "Cloud", optional: true, text: "What does this form capture?", attach: "First attach demo-kit\\encore\\hydrant-inspection-form.png with the paperclip.", after: "The local model reads text only. Images go to a model that can see them." }
      ],
      warn: "Don't call the cloud reply private. Don't add follow-ups: each message carries the previous one. If R2 errors, hangs past 20 s or stops mid-sentence: \"The cloud's having a moment. That's the point: everything else kept working offline.\" Move on to R3.",
      closeLine: "You set the rules. Private stays local, routine stays free, and you pay the cloud only when it earns it." },
    { title: "If something goes wrong", table: [
      ["An answer is slow", "Wait. Keep talking.", "It's thinking it through, all locally."],
      ["An answer misses a fact", "Move on. Don't re-ask.", "Real model, real documents, no script."],
      ["Deal Room isn't READY yet", "Talk about the meter 10 s more.", "While that loads, look at the team-scale number."],
      ["Meter pill turns amber", "Ignore it. Meter key 2 adds a question by hand.", "Nothing. The totals are kept."]
    ] }
  ];

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Every prompt in show order, with its number key (1 to 9).
  const PROMPTS = [];
  for (const s of SHOW) for (const p of s.prompts || []) PROMPTS.push({ ...p, ws: s.ws, encore: !!s.encore, key: String(PROMPTS.length + 1) });
  let copied = new Set(store.get("show:copied", []));
  let encoreOpen = store.get("show:encore", false);

  // ---------- Render ----------
  function promptCard(p) {
    const route = p.route ? `<span class="route ${p.route === "Cloud" ? "cloud" : ""}">${p.route}</span>` : "";
    const opt = p.optional ? `<span class="route">optional</span>` : "";
    const attach = p.attach ? `<div class="meta"><span class="hot">${esc(p.attach)}</span></div>` : "";
    const expect = p.expect ? `<div class="meta">Listen for: <b>${esc(p.expect)}</b></div>` : "";
    const after = p.after ? `<div class="meta">Say after: <span class="after">${sayLine(p.after)}</span></div>` : "";
    return `<button class="card" data-key="${p.key}"><div class="head"><span class="id">${p.id}</span>${route}${opt}<span class="state"><span class="st">Click to copy</span><kbd>${p.key}</kbd></span></div>${attach}<div class="q">${esc(p.text)}</div>${expect}${after}</button>`;
  }
  function sectionBody(s) {
    let h = "";
    if (s.check) h += `<ul class="check">${s.check.map((c, i) => `<li><label><input type="checkbox" data-check="${i}">${esc(c)}</label></li>`).join("")}</ul>`;
    if (s.hot) h += `<div class="k">Do</div><div class="hot">${esc(s.hot)}</div>`;
    if (s.doList) h += `<div class="k">Do</div><ol>${s.doList.map((d) => `<li>${esc(d)}</li>`).join("")}</ol>`;
    if (s.sayFirst) h += `<div class="k">Say first</div><ul class="say"><li>"${esc(s.sayFirst)}"</li></ul>`;
    if (s.prompts) h += `<div class="k">Paste into ${esc(s.ws)}</div>` + s.prompts.map((p) => promptCard(PROMPTS.find((x) => x.id === p.id && x.text === p.text))).join("");
    if (s.say) h += `<div class="k">${s.prompts ? "Say while it writes" : "Say"}</div><ul class="say">${s.say.map((l) => `<li>${sayLine(l)}</li>`).join("")}</ul>`;
    if (s.wait) h += `<div class="k">Wait</div><div class="hot">${esc(s.wait)}</div>`;
    if (s.note) h += `<div class="meta" style="margin-top:6px;color:var(--muted);font-size:13px">${esc(s.note)}</div>`;
    if (s.warn) h += `<div class="warnbox">${esc(s.warn)}</div>`;
    if (s.closeLine) h += `<div class="k">Close the encore</div><ul class="say"><li>"${esc(s.closeLine)}"</li></ul>`;
    if (s.table) h += `<table><tr><th>Problem</th><th>Do</th><th>Say</th></tr>${s.table.map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>"${esc(r[2])}"</td></tr>`).join("")}</table>`;
    return h;
  }
  // "(Point at the meter) Some words" -> a dim stage cue, then the quoted words.
  function sayLine(l) {
    const m = /^\(([^)]*)\)\s*(.*)$/.exec(l);
    if (!m) return `"${esc(l)}"`;
    return `<span style="color:var(--dim)">${esc(m[1])}:</span>${m[2] ? ` "${esc(m[2])}"` : ""}`;
  }
  function headline(s) {
    return `${esc(s.title)}${s.time ? ` <span class="t">${esc(s.time)}</span>` : ""}${s.ws ? `<span class="ws">${esc(s.ws)}</span>` : ""}`;
  }
  function render() {
    $("main").innerHTML = SHOW.map((s) => s.encore
      ? `<section><details id="encore" ${encoreOpen ? "open" : ""}><summary><h2>${headline(s)}</h2></summary>${sectionBody(s)}</details></section>`
      : `<section><h2>${headline(s)}</h2>${sectionBody(s)}</section>`).join("");
    const checks = store.get("show:checks", []);
    document.querySelectorAll("[data-check]").forEach((c) => { c.checked = checks.includes(+c.dataset.check); c.addEventListener("change", saveChecks); });
    document.querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => copyPrompt(c.dataset.key)));
    $("encore")?.addEventListener("toggle", (e) => { encoreOpen = e.target.open; store.set("show:encore", encoreOpen); update(); });
    update();
  }
  function saveChecks() { store.set("show:checks", [...document.querySelectorAll("[data-check]:checked")].map((c) => +c.dataset.check)); }

  // The next prompt skips the encore unless it is open, and optional prompts.
  function nextPrompt() { return PROMPTS.find((p) => !copied.has(p.key) && !p.optional && (!p.encore || encoreOpen)); }
  function update() {
    const n = nextPrompt();
    document.querySelectorAll(".card").forEach((c) => {
      const done = copied.has(c.dataset.key);
      c.classList.toggle("done", done);
      c.classList.toggle("is-next", !!n && c.dataset.key === n.key);
      c.querySelector(".st").textContent = done ? "Copied ✓" : "Click to copy";
    });
    $("nextTxt").textContent = n ? `${n.id}: ${n.text}` : (encoreOpen ? "All prompts copied." : "All main prompts copied. Open the encore below if you're doing it.");
    $("nextWs").textContent = n ? `in ${n.ws}` : "";
    $("nextBtn").disabled = !n;
  }

  // ---------- Copy ----------
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const t = document.createElement("textarea"); // fallback, e.g. when opened from disk
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    t.remove(); return ok;
  }
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600); }
  async function copyPrompt(key) {
    const p = PROMPTS.find((x) => x.key === key); if (!p) return;
    if (p.encore && !encoreOpen) { encoreOpen = true; store.set("show:encore", true); $("encore").open = true; }
    const ok = await writeClipboard(p.text);
    if (!ok) { toast("Copy failed. Select the text and press Ctrl+C."); return; }
    copied.add(key); store.set("show:copied", [...copied]); update();
    const card = document.querySelector(`.card[data-key="${key}"]`);
    card?.classList.add("flash"); setTimeout(() => card?.classList.remove("flash"), 500);
    toast(`${p.id} copied. Paste into ${p.ws} with Ctrl+V.`);
  }
  $("nextBtn").addEventListener("click", () => { const n = nextPrompt(); if (n) copyPrompt(n.key); });
  $("resetBtn").addEventListener("click", () => { copied = new Set(); store.set("show:copied", []); store.set("show:checks", []); render(); toast("Cleared for the next run."); });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); const n = nextPrompt(); if (n) copyPrompt(n.key); return; }
    if (/^[1-9]$/.test(e.key) && PROMPTS.some((p) => p.key === e.key)) { e.preventDefault(); copyPrompt(e.key); }
  });

  // ---------- AnythingLLM status (through the meter helper, when served by it) ----------
  async function status() {
    let txt = "Meter helper off", cls = "bad";
    try {
      const j = await (await fetch("/api/health", { cache: "no-store" })).json();
      if (j.adapter?.msg === "connected") { txt = "AnythingLLM connected"; cls = "ok"; }
      else { txt = j.adapter?.msg ? `AnythingLLM: ${j.adapter.msg}` : "Manual events only"; cls = j.adapter?.ok === false ? "bad" : ""; }
    } catch { if (location.protocol === "file:") { txt = "Opened from disk"; cls = ""; } }
    $("allmTxt").textContent = txt; $("allmDot").className = "dot " + cls;
  }

  render(); status(); setInterval(status, 5000);
})();
</script>
</body>
</html>
